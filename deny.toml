[advisories]
# unmaintained：只对工作区直接依赖报警。
# 传递依赖（gtk-rs / unic-* / paste / proc-macro-error / encoding / rustls-pemfile 等）
# 由上游库引入，我们无法单独替换；它们衡量的是上游活跃度，不是本仓库的代码质量。
unmaintained = "workspace"

ignore = [
    # RUSTSEC-2023-0071 — rsa crate 的 Marvin Attack（RSA 解密时序侧信道）
    # 官方结论："No safe upgrade is available!"（RustCrypto/RSA#626，至今无修复版本）
    # 本地全部经 russh / makiko / rbdc-mysql / jsonwebtoken 传递引入，无法单独替换。
    # 复查日期：2026-11-01（届时确认 RustCrypto 是否已发布修复版）
    "RUSTSEC-2023-0071",
]

[licenses]
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "CC0-1.0",
    "CDLA-Permissive-2.0",
    "ISC",
    "MIT",
    "MIT-0",
    "MPL-2.0",
    "NCSA",
    "OpenSSL",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "Unlicense",
    "Zlib",
]
confidence-threshold = 0.8

[licenses.private]
ignore = true

[bans]
multiple-versions = "warn"
wildcards = "allow"
highlight = "all"
workspace-default-features = "allow"
external-default-features = "allow"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = [
    "https://github.com/86maid/ddddocr.git",
    "https://github.com/86maid/ort.git",
]
